<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Day in the Sky</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section class="morning">
        <div class="sun"></div>

        <div class="text">
            <h1>A Day in the Sky</h1>
            <p>Scroll down to follow the day.</p>
        </div>
    </section>


    <section class="afternoon">

        <div class="text reveal">
            <h2>Afternoon</h2>
            <p>The sun reaches its highest point.</p>
        </div>

    </section>


    <section class="sunset">

        <div class="text reveal">
            <h2>Sunset</h2>
            <p>The sky begins to change.</p>
        </div>

    </section>


    <section class="night">

      <div class="stars">
    ★ ★ ★ ★ ★
</div>

        <div class="text reveal">
            <h2>Night</h2>
            <p>Another day comes to an end.</p>
        </div>

    </section>

    <script src="script.js"></script>

</body>

</html>
